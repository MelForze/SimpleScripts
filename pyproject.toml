[build-system]
requires = []
build-backend = "packaging_backend"
backend-path = ["."]

[project]
name = "simplescripts"
version = "1.0.3"
description = "Collection of offensive-security and utility scripts from the SimpleScripts repository."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "MelForze" }
]
dependencies = [
  "ipwhois>=1.2.0",
  "passlib>=1.7.4",
  "pycryptodome>=3.20.0",
  "requests>=2.31.0",
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/MelForze/SimpleScripts"
Repository = "https://github.com/MelForze/SimpleScripts"
